# Cloud Build pipeline for ChemVantage deployment to Cloud Run.
#
# This file is environment-neutral. Use substitutions (or wrapper scripts)
# to target dev or production explicitly.
#
# Example invocation (dev):
# gcloud builds submit --config cloudbuild.yaml \
#   --substitutions _PROJECT_ID=dev-vantage-hrd,_REGION=us-central1,_REPOSITORY=chemvantage,_SERVICE=chemvantage-dev,_IMAGE_TAG=$(git rev-parse --short HEAD),_TASKS_OIDC_SERVICE_ACCOUNT=SERVICE_ACCOUNT_EMAIL

# Example invocation (prod):
# gcloud builds submit --config cloudbuild.yaml \
#   --substitutions _PROJECT_ID=chem-vantage-hrd,_REGION=us-central1,_REPOSITORY=chemvantage,_SERVICE=chemvantage-prod,_IMAGE_TAG=$(git rev-parse --short HEAD),_TASKS_OIDC_SERVICE_ACCOUNT=SERVICE_ACCOUNT_EMAIL

substitutions:
  _PROJECT_ID: dev-vantage-hrd
  _REGION: us-central1
  _REPOSITORY: chemvantage
  _SERVICE: chemvantage-dev
  _IMAGE_TAG: dev
  _TASKS_OIDC_SERVICE_ACCOUNT: ""

steps:
  - name: gcr.io/cloud-builders/docker
    id: Build image
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    id: Push image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy to Cloud Run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${_PROJECT_ID}
      - --region=${_REGION}
      - --platform=managed
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=1
      - --max-instances=5
      - --set-env-vars=ENFORCE_HTTPS=true,CLOUD_TASKS_OIDC_SERVICE_ACCOUNT=${_TASKS_OIDC_SERVICE_ACCOUNT}

images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
